name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: arm32
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$(pwd):/src" -w /src \
            debian:bookworm-slim \
            bash -c '
              apt-get update -qq &&
              apt-get install -y -qq g++ make > /dev/null 2>&1 &&
              make all &&
              cp codectx /src/codectx-linux-${{ matrix.arch }}
            '
          ls -lh codectx-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codectx-linux-${{ matrix.arch }}
          path: codectx-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
